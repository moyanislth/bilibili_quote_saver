<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bilibili Quote Saver</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="app">
      <header class="header">
        <div>
          <h1>Bilibili Quote Saver</h1>
          <p>按一次开始记录，再按一次停止并汇总字幕</p>
          <div id="recording-timer" class="recording-timer" style="display: none;"></div>
        </div>
        <button id="toggle-capture" class="primary-button">开始记录</button>
      </header>

      <section class="toolbar">
        <span id="count-label">0 条收藏</span>
        <span id="storage-usage" class="storage-usage"></span>
        <select id="lang-select" class="lang-select" title="字幕语言偏好">
          <option value="zh-CN">中文</option>
          <option value="en-US">English</option>
          <option value="ja-JP">日本語</option>
          <option value="auto">Auto</option>
        </select>
        <span class="toolbar-spacer"></span>
        <div class="dropdown" id="export-dropdown">
          <button type="button" class="text-button" id="export-toggle">导出 ▾</button>
          <div class="dropdown-menu" id="export-menu">
            <button type="button" data-format="json">JSON</button>
            <button type="button" data-format="txt">TXT</button>
            <button type="button" data-format="markdown">Markdown</button>
          </div>
        </div>
        <button type="button" class="text-button" id="import-btn">导入</button>
        <input type="file" id="import-input" accept=".json" style="display:none">
        <button id="clear-all" class="text-button">清空</button>
        <select id="sort-select" class="sort-select">
          <option value="newest">最新优先</option>
          <option value="oldest">最早优先</option>
          <option value="video">按视频</option>
        </select>
        <input type="search" id="search-input" class="search-input" placeholder="搜索字幕内容…" />
      </section>

      <div id="tag-filter-bar" class="tag-filter-bar" style="display:none;"></div>

      <section id="status" class="status" aria-live="polite"></section>
      <div id="live-preview" class="live-preview" style="display:none;">
        <div class="live-preview-header">
          <span class="live-dot"></span>
          <span>Live 录制预览</span>
        </div>
        <div id="live-preview-items" class="live-preview-items"></div>
      </div>
      <div id="storage-warning" class="storage-warning" style="display: none;"></div>
      <div id="loading-skeleton" class="loading-skeleton" style="display:none;">
        <div class="skeleton-card"><div class="skeleton-line skeleton-line-long"></div><div class="skeleton-line skeleton-line-short"></div><div class="skeleton-line skeleton-line-mid"></div></div>
        <div class="skeleton-card"><div class="skeleton-line skeleton-line-long"></div><div class="skeleton-line skeleton-line-short"></div></div>
        <div class="skeleton-card"><div class="skeleton-line skeleton-line-mid"></div><div class="skeleton-line skeleton-line-long"></div></div>
      </div>
      <section id="captures" class="captures"></section>
    </main>

    <script type="module" src="popup.js"></script>
  </body>
</html>
